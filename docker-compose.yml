services:
  bridge:
    build:
      context: .
      dockerfile: packages/bridge/Dockerfile
    container_name: makgrill-bridge
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      - TZ=${TIMEZONE:-America/Los_Angeles}
      - DB_PATH=/data/cooks.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAKGRILL_SECRET=${MAKGRILL_SECRET:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - BRIDGE_PORT=80
      - WEB_ORIGIN=${WEB_ORIGIN:-http://web:3000}
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        NEXT_PUBLIC_GIT_COMMIT: ${NEXT_PUBLIC_GIT_COMMIT:-}
    container_name: makgrill-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - TZ=${TIMEZONE:-America/Los_Angeles}
      - BRIDGE_URL=http://bridge:80
      - MAKGRILL_SECRET=${MAKGRILL_SECRET:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
