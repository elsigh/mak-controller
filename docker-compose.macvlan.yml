services:
  bridge:
    build:
      context: .
      dockerfile: packages/bridge/Dockerfile
    container_name: makgrill-bridge
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      - TZ=${TIMEZONE:-America/Los_Angeles}
      - DB_PATH=/data/cooks.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAKGRILL_SECRET=${MAKGRILL_SECRET:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - BRIDGE_PORT=80
      - WEB_ORIGIN=http://web:3000
    networks:
      lan_net:
        ipv4_address: ${CONTAINER_IP}
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: makgrill-web
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-America/Los_Angeles}
      - BRIDGE_URL=http://bridge:80
      - MAKGRILL_SECRET=${MAKGRILL_SECRET:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      lan_net: {}

networks:
  lan_net:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_INTERFACE}
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
          ip_range: ${CONTAINER_IP}/32
